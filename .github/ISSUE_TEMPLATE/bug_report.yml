name: Bug report
description: Something does not build or work
labels: [bug]
body:
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Output of `flutter --version` (first line)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iOS, Android, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce and the full error output.
    validations:
      required: true
