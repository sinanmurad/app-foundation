name: Analyze

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create .env from example
        run: cp .env.example .env
      - run: flutter pub get
      - run: dart tool/preflight.dart
      - run: flutter analyze --no-fatal-infos
